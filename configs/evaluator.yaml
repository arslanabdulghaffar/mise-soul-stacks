# Team-defined predicates, frozen per run by recording this file's SHA256.
# World +x is camera-right; +y is camera-up. Regions score object centers.
drawer_open_fraction: 0.80
drawer_hold_s: 0.5
placement_hold_s: 1.0
stability_speed_m_s: 0.02
stability_angular_speed_rad_s: 0.10
mug_max_tilt_degrees: 15.0
handoff_hold_s: 1.0
episode_timeout_s: 180.0
object_loss_height_m: 0.50
max_sample_gap_s: 0.10
# The upstream README explicitly flags base collisions and gripper mapping.
# Keep full-task certification disabled until physical expert validation exists.
gripper_contacts_validated: false
collision_geometry_validated: false
