  spoon: {name: spoon_right, center_xy: [0.25, 0.0], radius_m: 0.02, height_range_m: [0.780, 0.792]}
  mug: {name: mug_upper_right, center_xy: [0.25, 0.20], radius_m: 0.02, height_range_m: [0.829, 0.851]}
