name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libosmesa6
      - name: Install Python package
        run: python -m pip install -c constraints.txt -e '.[test]'
      - name: Build MuJoCo scene
        run: python scripts/build_scene.py
      - name: Run Python regression suite
        env:
          MUJOCO_GL: osmesa
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build production console
        working-directory: web
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build image from clean checkout
        run: docker build --tag mise:ci .
      - name: Start packaged console and simulation worker
        run: docker run --detach --init --name mise-ci --publish 127.0.0.1:8000:8000 --shm-size 512m mise:ci
      - name: Verify frontend, live API, physical contact and recorded artifacts
        run: python3 scripts/smoke_runtime.py --url http://127.0.0.1:8000 --timeout 600
      - name: Retain container logs and run evidence
        if: always()
        run: |
          mkdir -p .smoke-artifacts
          docker logs mise-ci > .smoke-artifacts/container.log 2>&1 || true
          docker cp mise-ci:/app/artifacts/runs .smoke-artifacts/runs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-evidence
          path: .smoke-artifacts
          retention-days: 7
      - name: Stop container
        if: always()
        run: docker rm --force mise-ci || true
